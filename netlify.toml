[build]
  base    = "web"
  command = "npm run build"
  # Relativo à base. Com base = "web", "dist" resolve para web/dist.
  # Escrever "web/dist" aqui daria web/web/dist e falharia a seguir.
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

  # A config do Firebase para browser é pública por desenho: o Vite injecta
  # as VITE_* no bundle e é assim que tem de ser. Quem fecha os dados são as
  # firestore.rules, não o segredo da chave. Sem estas duas linhas o
  # secret scanning do Netlify vê o AIza... no dist/ e chumba o build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_SENDER_ID,VITE_FIREBASE_APP_ID"

  # A deteção inteligente reconhece o formato AIza... independentemente do
  # nome da variável, por isso a linha de cima sozinha não chega.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Um site do Netlify, tres contextos. O branch deploy da main e producao;
# dev e test ganham URLs proprios (dev--nome-do-site.netlify.app).
[context.production.environment]
  VITE_AMBIENTE = "prod"

[context.branch-deploy.environment]
  VITE_AMBIENTE = "test"

[context.deploy-preview.environment]
  VITE_AMBIENTE = "test"

# PWA em rota unica: tudo cai no index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # O login do Google abre um popup e fecha-o quando acaba. Sem isto o
    # Chrome bloqueia o window.close e enche a consola de avisos de COOP.
    # "same-origin-allow-popups" mantem o isolamento da pagina e deixa
    # passar so o popup que nos abrimos.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
